# Rum mitt i stan: download chosen Wikimedia Commons photos into rum-mitt-i-stan/img.
name: Rum mitt i stan photos

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/rmis-photos.yml"
      - ".github/scripts/rmis_photos.py"

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pillow
      - run: python3 .github/scripts/rmis_photos.py
      - name: Commit photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rum-mitt-i-stan/img
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Rum mitt i stan: add more Grebbestad photos from Wikimedia Commons"
          git push
