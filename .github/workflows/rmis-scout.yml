# Rum mitt i stan: collect the owners' photos and free Grebbestad photos as contact sheets for review.
name: Rum mitt i stan scout

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/rmis-scout.yml"
      - ".github/scripts/rmis_scout.py"

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/rmis_scout.py
        env:
          RMIS_SEARCH: "oysters Grebbestad|ostron Grebbestad|oysters on ice lemon|Ostronakademin|Ostrea edulis plate|oysters platter"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/rmis-scout
          git diff --cached --quiet && exit 0
          git commit -m "Rum mitt i stan: photo scout results"
          git push
