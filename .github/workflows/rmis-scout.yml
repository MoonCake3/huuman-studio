# Rum mitt i stan: look for the owners' own photos in Internet Archive copies of their old site.
name: Rum mitt i stan scout

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/rmis-scout.yml"
      - ".github/scripts/rmis_scout.py"

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/rmis_scout.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/rmis-scout
          git diff --cached --quiet && exit 0
          git commit -m "Rum mitt i stan: owner photo scout results"
          git push
